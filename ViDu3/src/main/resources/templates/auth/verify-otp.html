<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Xác nhận OTP')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1>Xác nhận OTP</h1>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>
            <label>Email</label>
            <input type="email" th:field="*{email}" required>

            <label>Mã OTP 6 số</label>
            <input th:field="*{otp}" maxlength="6" inputmode="numeric" placeholder="6 chữ số OTP" required autofocus>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div style="margin-top: 20px;">
                <button class="button full" type="submit">Xác nhận kích hoạt</button>
            </div>
        </form>

        <form th:action="@{/resend-register-otp}" method="post" class="mt">
            <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="button secondary full" type="submit">Gửi lại OTP</button>
        </form>

        <p style="margin-top: 15px; text-align: center;">
            <a th:href="@{/login}">Quay lại trang Đăng nhập</a>
        </p>
    </div>
</div>
</body>
</html>
