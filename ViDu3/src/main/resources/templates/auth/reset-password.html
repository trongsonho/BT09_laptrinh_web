<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1>Đặt lại mật khẩu</h1>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>
            <label>Email</label>
            <input type="email" th:field="*{email}" required>

            <label>Mã OTP (6 chữ số)</label>
            <input name="otp" maxlength="6" inputmode="numeric" placeholder="6 chữ số OTP" required autofocus>

            <label>Mật khẩu mới</label>
            <input type="password" th:field="*{password}" placeholder="Tối thiểu 6 ký tự" required>

            <label>Xác nhận mật khẩu mới</label>
            <input type="password" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới" required>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div style="margin-top: 20px;">
                <button class="button full" type="submit">Đổi mật khẩu</button>
            </div>
        </form>

        <p style="margin-top: 15px; text-align: center;">
            <a th:href="@{/login}">Quay lại trang Đăng nhập</a>
        </p>
    </div>
</div>
</body>
</html>
