<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1>Đăng nhập</h1>
        <div th:if="${param.error}" class="alert error">Username/password không đúng hoặc tài khoản chưa được xác thực.</div>
        <div th:if="${param.logout}" class="alert success">Bạn đã đăng xuất thành công.</div>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <label>Username hoặc Email</label>
            <input name="username" placeholder="Nhập username hoặc email" required autofocus>

            <label>Password</label>
            <input type="password" name="password" placeholder="Nhập mật khẩu" required>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div style="margin-top: 20px;">
                <button class="button full" type="submit">Đăng nhập</button>
            </div>
        </form>

        <p style="margin-top: 15px; display: flex; justify-content: space-between;">
            <a th:href="@{/register}">Tạo tài khoản mới</a>
            <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
        </p>
    </div>
</div>
</body>
</html>
