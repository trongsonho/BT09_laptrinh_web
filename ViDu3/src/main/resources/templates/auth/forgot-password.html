<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1>Quên mật khẩu</h1>
        <p>Nhập địa chỉ email đăng ký để nhận mã OTP đặt lại mật khẩu:</p>

        <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="example@gmail.com" required autofocus>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div style="margin-top: 20px;">
                <button class="button full" type="submit">Gửi mã OTP</button>
            </div>
        </form>

        <p style="margin-top: 15px; text-align: center;">
            <a th:href="@{/login}">Quay lại trang Đăng nhập</a>
        </p>
    </div>
</div>
</body>
</html>
