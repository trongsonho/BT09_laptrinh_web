<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm Product' : 'Sửa Product'})}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
    <div class="form-card">
        <h1 th:text="${mode == 'create' ? 'Thêm Product' : 'Sửa Product'}"></h1>

        <form th:object="${productDTO}"
              th:action="${mode == 'create' ? '/products/create' : '/products/edit/' + productDTO.id}"
              method="post"
              enctype="multipart/form-data">

            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>

            <input type="hidden" th:field="*{id}">

            <div>
                <label for="name">Tên sản phẩm</label>
                <input id="name" type="text" th:field="*{name}" required>
                <small class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
            </div>

            <div>
                <label for="description">Mô tả</label>
                <textarea id="description" th:field="*{description}" rows="4"></textarea>
            </div>

            <div>
                <label for="price">Giá (VNĐ)</label>
                <input id="price" type="number" step="0.01" th:field="*{price}" required>
                <small class="error-text" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></small>
            </div>

            <div>
                <label for="image">Ảnh sản phẩm (Tải lên Cloudinary)</label>
                <input id="image" type="file" name="image" accept="image/*">
            </div>

            <div th:if="${productDTO.imageUrl != null and !#strings.isEmpty(productDTO.imageUrl)}" style="margin: 15px 0;">
                <p>Ảnh hiện tại:</p>
                <img th:src="${#strings.substringBefore(productDTO.imageUrl, '|')}" class="preview" alt="Current Image">
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="submit" class="button">Lưu sản phẩm</button>
                <a class="button secondary" th:href="@{/products}">Hủy</a>
            </div>
        </form>
    </div>
</main>
</div>
</body>
</html>
