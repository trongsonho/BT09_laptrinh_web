spring.config.import=optional:file:.env[.properties]
spring.application.name=shop
server.port=${SERVER_PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=webst3;encrypt=false;trustServerCertificate=true;sslProtocol=TLSv1.2;characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:1234567@a$}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:dummy_user@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dummy_cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:dummy_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:dummy_secret}

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Thymeleaf
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

spring.main.allow-bean-definition-overriding=true
