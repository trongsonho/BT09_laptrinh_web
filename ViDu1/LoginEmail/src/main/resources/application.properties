spring.config.import=optional:file:.env[.properties]
spring.application.name=springboot1-8
server.port=${SERVER_PORT:8088}

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=webst4;encrypt=false;trustServerCertificate=true;sslProtocol=TLSv1.2;characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:1234567@a$}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

ADMIN_EMAIL=${ADMIN_EMAIL:trungnh@hcmute.edu.vn}
ADMIN_PASSWORD=${ADMIN_PASSWORD:123456}

spring.main.allow-bean-definition-overriding=true
